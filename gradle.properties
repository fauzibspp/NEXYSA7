# JVM args for the Gradle build.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by Compose and the AndroidX libraries used in this project.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Compile in-process so the build works in restricted/CI environments where a
# separate Kotlin daemon cannot be reached.
kotlin.compiler.execution.strategy=in-process
